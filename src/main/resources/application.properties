spring.application.name=wellu-community-service

server.port=${SERVER_PORT:8080}

spring.datasource.url=${COMMUNITY_DB_URL:jdbc:postgresql://localhost:5432/wellu_community}
spring.datasource.username=${COMMUNITY_DB_USERNAME:postgres}
spring.datasource.password=${COMMUNITY_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.neo4j.uri=${COMMUNITY_NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${COMMUNITY_NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${COMMUNITY_NEO4J_PASSWORD:password}

jwt.secret=${JWT_SECRET:c2c3d5ac2473439e4c6931f7f7ebf8c8}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
